services:
  # ---------- Local mail server (IMAP + SMTP) ----------
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.example.test
    domainname: example.test
    cap_add:
      - NET_ADMIN  
    ports:
      - "3025:25"    # SMTP
      - "3143:143"   # IMAP
      - "3587:587"   # Submission
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
    environment:
      # Disable heavy services not needed for dev
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_AMAVIS=0
      - ENABLE_UPDATE_CHECK=0
      # No SSL for local dev (plain IMAP/SMTP)
      - SSL_TYPE=
      # Allow relay from any container on the same docker network
      - PERMIT_DOCKER=connected-networks
      - OVERRIDE_HOSTNAME=mail.example.test
      - POSTFIX_INET_PROTOCOLS=ipv4
      - DOVECOT_INET_PROTOCOLS=ipv4
      # Accept mail without strict hostname checks
      - ENABLE_SRS=0
    restart: unless-stopped
    healthcheck:
      # Gate on submission (587) and IMAP (143) — ports Roundcube actually connects to
      test: ss -lnt | grep -q ':587' && ss -lnt | grep -q ':143' || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s


  # ---------- Roundcube webmail ----------
  roundcube:
    build:
      context: .
      dockerfile: Dockerfile.roundcube
    container_name: roundcube-dev
    restart: unless-stopped
    stop_grace_period: 10s
    cap_add:
      - NET_ADMIN  
    ports:
      - "8000:80"
    volumes:
      # Roundcube source (git clone on host — symlinks for skins/plugins already inside)
      - ../roundcubemail:/var/www/html:delegated
      # Live Roundcube config from repo (edit docker/config/roundcube.config.inc.php in realtime)
      - ./config/custom.inc.php:/var/www/html/config/config.inc.php
      # Resolve Roundcube symlinks like ../../plugins/* and ../../skins/* from /var/www/html
      - ../plugins:/var/www/plugins:delegated
      - ../skins:/var/www/skins:delegated
      # Persist SQLite database in a named volume (native ext4 inside the Docker VM).
      # IMPORTANT: bind-mounting to macOS breaks SQLite's fcntl file locking,
      # which causes "file is not a database" corruption under concurrent writes.
      - roundcube-db:/var/roundcube/db
      # Logs
      - ./logs:/var/roundcube/logs
      # Custom PHP settings (upload limits, timezone, etc.)
      - ./roundcube.ini:/usr/local/etc/php/conf.d/zzz_roundcube-custom.ini
      # rcmcarddav preset config (CardDAV via Davis)
      - ./config/carddav.config.inc.php:/var/www/html/plugins/carddav/config.inc.php
      # Composer cache (speeds up rebuilds)
      - composer-cache:/root/.composer
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
  # ---------- Davis CalDAV / CardDAV ----------

  davis:
    image: ghcr.io/tchapi/davis:latest
    container_name: davis
    user: "0:0"
    command: >-
      sh -c "chown -R www-data:www-data /data /var/www/davis/var
      && su -s /bin/sh www-data -c 'php /var/www/davis/bin/console doctrine:migrations:migrate --no-interaction'
      && cp -a /var/www/davis/public/. /davis-public/
      && exec php-fpm"
    environment:
      - APP_ENV=prod
      - DATABASE_DRIVER=sqlite
      - DATABASE_URL=sqlite:////data/davis-database.db
      - CALDAV_ENABLED=true
      - CARDDAV_ENABLED=true
      - WEBDAV_ENABLED=false
      - ADMIN_LOGIN=admin
      - ADMIN_PASSWORD=admin
      - AUTH_METHOD=IMAP
      - IMAP_AUTH_URL=mailserver:143
      - IMAP_ENCRYPTION_METHOD=false
      - IMAP_CERTIFICATE_VALIDATION=false
      - IMAP_AUTH_USER_AUTOCREATE=true
      - AUTH_REALM=SabreDAV
      - APP_TIMEZONE=UTC
      - INVITE_FROM_ADDRESS=no-reply@example.test
    volumes:
      - davis-data:/data
      - davis-public:/davis-public
    depends_on:
      mailserver:
        condition: service_healthy
    restart: unless-stopped

  davis-nginx:
    image: nginx:1.25-alpine
    container_name: davis-nginx
    ports:
      - "9000:80"
    volumes:
      - davis-public:/var/www/davis/public:ro
      - ./config/davis-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - davis
    restart: unless-stopped

volumes:
  maildata:
  mailstate:
  maillogs:
  composer-cache:
  roundcube-db:
  davis-data:
  davis-public:
