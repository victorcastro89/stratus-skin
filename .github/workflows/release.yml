name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Bundle (skins/ + plugins/ layout — unzip directly into Roundcube root)
          mkdir -p dist/skins dist/plugins
          cp -r skins/stratus          dist/skins/stratus
          cp -r plugins/stratus_helper dist/plugins/stratus_helper
          cp -r plugins/undo_send      dist/plugins/undo_send
          cp INSTALL.md CHANGELOG.md dist/
          cd dist && zip -r "../stratus-${VERSION}.zip" . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Stratus v${{ steps.version.outputs.version }}"
          body_path: changelog/${{ steps.version.outputs.version }}.md
          files: stratus-${{ steps.version.outputs.version }}.zip
