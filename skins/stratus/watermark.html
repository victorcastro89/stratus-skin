<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stratus for Roundcube</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mp-watermark {
    text-align: center;
    padding: 2rem;
    user-select: none;
    -webkit-user-select: none;
    /* opacity: 0.18; */
  }

  .mp-watermark img {
    display: block;
    width: 160px;
  }

  /* Light mode: show light logo, hide dark */
  .logo-light { display: block !important; }
  .logo-dark  { display: none !important; }

  /* Dark mode: Elastic adds/removes html.dark-mode on this iframe's <html> */
  html.dark-mode .logo-light { display: none !important; }
  html.dark-mode .logo-dark  { display: block !important; }
</style>
<!-- Mirror layout.html's early dark-mode detection to avoid flash on initial load.
     After load, Elastic owns the html.dark-mode class via switch_iframe_color_mode(). -->
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) {}
</script>
</head>
<body>
  <div class="mp-watermark">
    <img class="logo-light" src="images/logo.svg"      alt="Stratus" aria-hidden="true">
    <img class="logo-dark"  src="images/logo-dark.svg" alt="Stratus" aria-hidden="true">
  </div>
</body>
</html>
