<!-- Stratus pagenav override — smart bar with default + selection states for mail -->
<!-- Export labels to JS so rcmail.get_label() returns translated strings -->
<roundcube:add_label name="markread" />
<roundcube:add_label name="markunread" />
<roundcube:add_label name="markflagged" />
<roundcube:add_label name="markunflagged" />
<roundcube:add_label name="sentdate" />
<roundcube:add_label name="arrival" />
<roundcube:add_label name="from" />
<roundcube:add_label name="to" />
<roundcube:add_label name="fromto" />
<roundcube:add_label name="subject" />
<roundcube:add_label name="size" />
<roundcube:add_label name="cc" />
<roundcube:add_label name="listsorting" />
<roundcube:add_label name="asc" />
<roundcube:add_label name="desc" />
<roundcube:if condition="template:name == 'mail'" />
<div id="mail-list-navbar" class="pagenav menu footer small mp-smart-bar" role="toolbar" aria-label="<roundcube:label name="arialabellistnav" />">
	<div class="mp-smart-bar-left">
		<!-- (A) Select zone: checkbox (enters multiselect) + caret (opens batch-select popup) -->
		<span class="mp-mass-action-checkbox" id="mp-mass-select-checkbox"
			role="checkbox" aria-checked="false" tabindex="0"
			title="<roundcube:label name="select" />"></span>
		<a href="#select" id="mp-mass-select-caret" class="mp-mass-select-caret"
			data-popup="listselect-menu"
			title="<roundcube:label name="select" />" aria-haspopup="true">
			<span class="mp-select-caret-icon" aria-hidden="true"></span>
			<span class="inner"><roundcube:label name="select" /></span>
		</a>
		<!-- Default state: sort indicator + refresh (visible when no selection) -->
		<div class="mp-smart-bar-default" aria-label="List controls" id="sort-bar-mail-list">
			<a href="#sort" id="mp-sort-trigger" class="mp-sort-trigger"
				aria-haspopup="true" aria-expanded="false"
				title="<roundcube:label name="listsorting" />">
				<span class="mp-sort-arrow" aria-hidden="true"></span>
				<span class="mp-sort-label"></span>
			</a>
			<roundcube:button command="checkmail" type="link" class="mp-action-btn refresh"
				label="refresh" title="checkmail" innerclass="inner" />
		</div>
		<!-- Action buttons (visible only when messages selected — active state) -->
		<div class="mp-mass-action-actions" aria-label="Message actions">
			<roundcube:button command="delete" type="link"
				class="mp-action-btn delete disabled" classAct="mp-action-btn delete"
				title="deletemessage" innerclass="inner" label="delete" />
			<a href="#archive" id="mp-action-archive" class="mp-action-btn archive"
				title="<roundcube:label name="archive.buttontitle" />"
				><span class="inner"><roundcube:label name="archive.buttontext" /></span></a>
			<a href="#" id="mp-action-move" class="mp-action-btn move disabled"
				title="<roundcube:label name="moveto" />"
				onclick="return rcmail.command('move','',this,event)">
				<span class="inner"><roundcube:label name="moveto" /></span>
			</a>
			<span class="mp-mass-action-divider" aria-hidden="true"></span>
			<a href="#mark-toggle" id="mp-action-mark-toggle" class="mp-action-btn unread disabled" title="<roundcube:label name="markunread" />">
				<span class="inner"><roundcube:label name="markunread" /></span>
			</a>
			<a href="#flag-toggle" id="mp-action-flag-toggle" class="mp-action-btn unflag disabled" title="<roundcube:label name="markunflagged" />">
				<span class="inner"><roundcube:label name="markunflagged" /></span>
			</a>
			<span class="mp-mass-action-divider" aria-hidden="true"></span>
			<a href="#more" class="mp-action-btn more" data-popup="mp-massaction-menu"
				title="<roundcube:label name="moreactions" />">
				<span class="inner"><roundcube:label name="more" /></span>
			</a>
		</div>
	</div>
	<div class="mp-smart-bar-right">
		<!-- Selected count chip (active state only) -->
		<span id="mp-selected-count" class="mp-mass-action-chip" aria-live="polite"></span>
		<!-- Message count (enabled state only, hidden when active) -->
		<roundcube:object name="messageCountDisplay" class="pagenav-text mp-mass-action-count" aria-live="polite" aria-relevant="text" />
		<roundcube:button command="previouspage" type="link" class="prevpage disabled" classAct="prevpage"
			title="previouspage" label="previous" innerclass="inner" />
		<roundcube:button command="nextpage" type="link" class="nextpage disabled" classAct="nextpage"
			title="nextpage" label="next" innerclass="inner" />
	</div>
</div>
<!-- Mobile-only pagination: hidden on desktop, shown on html.layout-phone at standard elastic location -->
<div id="mp-mobile-pagenav" class="pagenav menu footer small" role="navigation" aria-label="<roundcube:label name="arialabellistnav" />">
	<roundcube:button command="previouspage" type="link" class="prevpage disabled" classAct="prevpage"
		title="previouspage" label="previous" innerclass="inner" />
	<roundcube:object name="messageCountDisplay" class="pagenav-text" aria-live="polite" aria-relevant="text" />
	<roundcube:button command="nextpage" type="link" class="nextpage disabled" classAct="nextpage"
		title="nextpage" label="next" innerclass="inner" />
</div>
<!-- Sort popup — opened by sort-controller.js via rcmail.command('menu-open').
     show_menu() relocates this to document.body; use standalone selectors in CSS.
     Uses the same .popupmenu + .menu.listing structure as #message-menu so Elastic's
     native styles apply (icon font, a.selected::before checkmark, hover colours). -->
<div id="mp-sort-menu" class="popupmenu" aria-label="Sort options">
	<ul class="menu listing" role="menu">
		<li role="menuitem"><a href="#sort" data-sort-col="date"><roundcube:label name="sentdate" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="arrival"><roundcube:label name="arrival" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="from"><roundcube:label name="from" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="to"><roundcube:label name="to" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="fromto"><roundcube:label name="fromto" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="subject"><roundcube:label name="subject" /></a></li>
		<li role="menuitem"><a href="#sort" data-sort-col="size"><roundcube:label name="size" /></a></li>
		<!-- Separator between sort columns and direction options -->
		<li class="mp-sort-dir-separator" role="separator"></li>
		<li role="menuitem"><a href="#sort-dir" data-sort-order="ASC" class="mp-sort-dir-option"><span class="mp-radio-dot"></span><roundcube:label name="asc" /></a></li>
		<li role="menuitem"><a href="#sort-dir" data-sort-order="DESC" class="mp-sort-dir-option"><span class="mp-radio-dot"></span><roundcube:label name="desc" /></a></li>
	</ul>
</div>
<roundcube:else />
<!-- Non-mail templates: standard elastic paging -->
<div class="pagenav menu footer small" role="toolbar" aria-label="<roundcube:label name="arialabellistnav" />">
	<roundcube:button command="firstpage" type="link" class="firstpage disabled" classAct="firstpage"
		title="firstpage" label="first" innerclass="inner" />
	<roundcube:button command="previouspage" type="link" class="prevpage disabled" classAct="prevpage"
		title="previouspage" label="previous" innerclass="inner" />
	<roundcube:if condition="template:name == 'addressbook'" />
		<span class="pagenav-text" aria-live="polite" aria-relevant="text">
			<roundcube:object name="recordsCountDisplay" label="fromtoshort" />
		</span>
	<roundcube:else />
		<span class="pagenav-text" aria-live="polite" aria-relevant="text">&nbsp;</span>
	<roundcube:endif />
	<roundcube:button command="nextpage" type="link" class="nextpage disabled" classAct="nextpage"
		title="nextpage" label="next" innerclass="inner" />
	<roundcube:button command="lastpage" type="link" class="lastpage disabled" classAct="lastpage"
		title="lastpage" label="last" innerclass="inner" />
</div>
<roundcube:endif />
